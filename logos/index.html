<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logos</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#f6f5f1;margin:0;padding:24px;color:#111318}section{max-width:960px;margin:0 auto 40px}h2{margin:0 0 4px}p{margin:0 0 14px;color:#6b7079}
.g{display:grid;grid-template-columns:2fr 2fr 1fr;gap:14px}.a{background:#fff;border:1px solid #e3e1da;border-radius:16px;display:grid;place-items:center;padding:28px;min-height:150px}.dk{background:#111318}img{max-width:100%;max-height:90px}
@media(max-width:700px){.g{grid-template-columns:1fr}}</style><section><h2>Opção 1 — Monograma GG</h2><p>Dois G entrelaçados, o segundo em azul. Compacto: funciona como avatar e ícone.</p>
<div class="g"><div class="a"><img src="opcao-1-horizontal.svg"></div><div class="a dk"><img src="opcao-1-horizontal-branco.svg"></div><div class="a ic"><img src="opcao-1-icone.svg"></div></div></section><section><h2>Opção 2 — Tipográfica</h2><p>Só o nome, elegante e editorial, com o ponto azul como assinatura.</p>
<div class="g"><div class="a"><img src="opcao-2-horizontal.svg"></div><div class="a dk"><img src="opcao-2-horizontal-branco.svg"></div><div class="a ic"><img src="opcao-2-icone.svg"></div></div></section><section><h2>Opção 3 — Símbolo G + sinal</h2><p>G aberto com um ponto azul (sinal/localização), nome em serifa.</p>
<div class="g"><div class="a"><img src="opcao-3-horizontal.svg"></div><div class="a dk"><img src="opcao-3-horizontal-branco.svg"></div><div class="a ic"><img src="opcao-3-icone.svg"></div></div></section>
